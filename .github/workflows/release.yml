# 推 tag 即建 GitHub Release（本仓库的发版约定：只推 tag 不算完成）
#
# 为什么要有它：本机没有 GitHub API token，也没有可用的浏览器自动化通道 —— 历史上每次发版
# 都要人工开 https://github.com/Zhuang-A/dsh-go-sensei/releases/new 粘一遍发布说明再点
# Publish。把这一步交给 Actions 之后，`git push --follow-tags` 就是完整的发版动作。
#
# 发布说明的**唯一来源是仓库里的文件** `docs/releases/<tag>.md`（跟 tag 一起提交）。
# 为什么不读注记 tag 的消息：`actions/checkout` 之后 `refs/tags/<tag>` 有时是轻量引用，
# 那时 `git tag -l --format='%(contents)'` 会静默回落成**提交信息**，Release 正文就变成
# commit 标题（v0.2.13 首次尝试实测踩到）。文件是确定性的、本地就能 `test -f` 验。
# 注记 tag 的消息仍然照旧写一份同样的内容（人类在 `git show vX.Y.Z` 时看得到）。
#
# 幂等：重复推同一个 tag 会刷新已有 Release 的正文与 Latest 标记，便于修错。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the release from docs/releases/<tag>.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          notes="docs/releases/${tag}.md"
          if [ ! -s "$notes" ]; then
            echo "缺少发布说明文件 $notes —— 请在打 tag 前把它和改动一起提交（本仓库的发版约定）" >&2
            exit 1
          fi
          if ! head -n 1 "$notes" | grep -q "$tag"; then
            echo "$notes 的首行未提到 $tag，疑似写错了文件：" >&2
            head -n 1 "$notes" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$notes" --latest
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file "$notes" \
              --verify-tag \
              --latest
          fi
