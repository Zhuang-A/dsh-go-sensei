# 推 tag 即建 GitHub Release（本仓库的发版约定：只推 tag 不算完成）
#
# 为什么要有它：本机没有 GitHub API token，也没有可用的浏览器自动化通道 —— 历史上每次发版
# 都要人工开 https://github.com/Zhuang-A/dsh-go-sensei/releases/new 粘一遍发布说明再点
# Publish。把这一步交给 Actions 之后，`git push --follow-tags` 就是完整的发版动作。
#
# 发布说明的**唯一来源是仓库里的文件** `docs/releases/<tag>.md`（跟 tag 一起提交）。
# 为什么不读注记 tag 的消息：`actions/checkout` 之后 `refs/tags/<tag>` 有时是轻量引用，
# 那时 `git tag -l --format='%(contents)'` 会静默回落成**提交信息**，Release 正文就变成
# commit 标题（v0.2.13 首次尝试实测踩到）。文件是确定性的、本地就能 `test -f` 验。
# 注记 tag 的消息仍然照旧写一份同样的内容（人类 `git show vX.Y.Z` 时看得到）。
#
# 幂等：重复推同一个 tag 会刷新已有 Release 的正文与 Latest 标记，便于修错。
# 自诊断：失败时把日志尾部发成**提交评论**（提交评论是公开可读的，而 Actions 日志需要 token ——
# 本机没有 token，所以这是唯一能把失败原因带出来的通道）。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish the release from docs/releases/<tag>.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          run_publish() {
            set -euo pipefail
            local tag="$GITHUB_REF_NAME"
            local notes="docs/releases/${tag}.md"
            test -s "$notes" || { echo "缺少发布说明文件 $notes —— 打 tag 前请把它和改动一起提交"; return 1; }
            if ! head -n 1 "$notes" | grep -q "$tag"; then
              echo "$notes 的首行未提到 $tag，疑似写错了文件："
              head -n 1 "$notes"
              return 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              # 已存在同名 Release：先补正文并**脱离 draft**，再单独标 Latest。
              # 为什么必须分两步：GitHub 在 tag 被删掉时会把对应 Release 转成 draft，
              # 而 `--latest` 不允许标在 draft/prerelease 上（实测 422：
              # "Latest release cannot be draft or prerelease"）。
              echo "已存在同名 Release，刷新正文并确保不是 draft"
              gh release edit "$tag" --title "$tag" --notes-file "$notes" --draft=false
              gh release edit "$tag" --latest
            else
              gh release create "$tag" \
                --title "$tag" \
                --notes-file "$notes" \
                --verify-tag \
                --latest
            fi
          }

          if run_publish > /tmp/release.log 2>&1; then
            cat /tmp/release.log
            exit 0
          fi

          echo "----- 发布失败，日志如下（同时会发成提交评论） -----"
          cat /tmp/release.log
          {
            echo "release workflow 失败：$GITHUB_REF_NAME（run $GITHUB_RUN_ID）"
            echo ""
            echo '```'
            tail -c 1500 /tmp/release.log
            echo '```'
          } > /tmp/diag.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@/tmp/diag.md || true
          exit 1
